[project]
name = "debate"
version = "0.1.0"
description = "多 Agent 对抗辩论模拟平台 · 后端与辩论引擎"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "langgraph>=0.2",
    "sqlmodel>=0.0.16",
    "greenlet>=3.0",
    "asyncmy>=0.2.9",
    "cryptography>=42.0",
    "jieba>=0.42",
    "rank-bm25>=0.2.2",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "uvicorn>=0.30",
    "tzdata>=2024.1",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pytest-xdist>=3.8.0",
    "fakeredis>=2.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# ISS-007：显式钉住规则集。ruff 0.17 起默认规则大幅扩张（ANN/BLE/PERF/RUF 等并非本项目
# 所选），工具升级不应静默制造 176 处"债务"；采用 ruff 传统默认集 E4/E7/E9/F 并保持清零，
# 后续要扩规则须在本表显式添加、逐条评审。
select = ["E4", "E7", "E9", "F"]
