[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elenchus"
version = "0.1.0"
description = "Socratic cross-examination for text: detect logical fallacies and manipulation via CLI, MCP, Discord, or Slack — with any LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cyd La Luz", email = "quetzaluz@gmail.com" }]
keywords = ["fallacy", "logic", "critical-thinking", "llm", "mcp", "discord", "slack", "moderation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: Text Processing :: Linguistic",
]
# Core stays tiny: stub mode works with just these. Providers/frontends are extras.
dependencies = [
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.40.0"]        # also covers Google (OpenAI-compatible endpoint)
discord = ["discord.py>=2.4.0"]
slack = ["slack-bolt>=1.18.0"]
mcp = ["mcp>=1.2.0"]
all = [
  "anthropic>=0.40.0",
  "openai>=1.40.0",
  "discord.py>=2.4.0",
  "slack-bolt>=1.18.0",
  "mcp>=1.2.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
elenchus = "elenchus.cli:main"

[project.urls]
Homepage = "https://github.com/quetzaluz/elenchus"

[tool.setuptools.packages.find]
include = ["elenchus*"]

[tool.setuptools.package-data]
elenchus = ["data/**/*"]
