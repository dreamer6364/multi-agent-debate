# 赛制与业务参数（字段规格以 SPEC §2.1 为准；密钥一律走 .env）

procedure:
  speed_cpm: 220            # 模拟语速：字/分钟，时长↔字数换算基数
  phases:                   # 各环节时长（分钟），键为环节标识
    opening: 1.0            # 主席开场
    statement: 3.0          # 开篇立论（每人）
    cross_examination: 1.5  # 质询一辩（每组）
    rebuttal: 2.0           # 驳论（每人）
    attack: 2.0             # 攻辩盘问（每组）
    attack_summary: 1.5     # 攻辩小结（每人）
    free_debate: 4.0        # 自由辩论（每队）
    closing: 3.0            # 总结陈词（每人）
    closing_ceremony: 1.5   # 主席结束致辞（仅导出口径，不计入赛制时长）
  free_debate_turn_cap: 0.5 # 自由辩单次发言上限（分钟，模拟短打）

model:
  temperature:
    debater: 0.85           # 辩手：进攻性与临场发挥
    judge: 0.3              # 评委：打分需稳定一致
    chair: 0.3              # 主席：纯流程播报
    digest: 0.2             # 战局摘要：压缩任务
  max_retries: 3
  timeout_seconds: 60
  min_call_interval: 15.0   # 相邻 LLM 调用最小间隔（免费档 RPM 保护；MIN_CALL_INTERVAL 环境变量可覆盖）
  degradation_limit: 5       # 连续降级熔断阈值（免费档建议 5：带占位跑完优于中止）

context:
  recent_speeches: 6        # 注入最近原文条数 K
  max_input_tokens: 4000    # 单次调用输入预算，超限按 ④→③→② 裁剪
  digest_max_chars: 1200

judges:
  count: 3                  # 1 | 3 | 5（5 时追加通用评委）
  timeout_seconds: 240.0    # 单评委评审总时长上限（秒）：超时按规则弃权，防止评分环节卡死
  heartbeat_seconds: 10.0   # 评审期进度心跳（秒）：前端显示"已评议 Xs"并作卡死自检
  throttle_seconds: 5.0     # v2.4 评审期限速覆盖（秒）：3 位评委并行调用只此几次，无需辩论期的保守间隔；0 = 不限速

engine:                     # v1.9.2 引擎总时限：任何单点卡死都不允许场次永远停在 running
  max_duration_seconds: 5400.0   # 整场硬上限（秒），到点置取消旗标
  cancel_grace_seconds: 90.0     # 置旗标后等引擎在节点边界退出
  drain_timeout_seconds: 15.0    # 收尾时落库队列排空上限

quota:
  concurrent_debates_per_user: 1   # 同时最多 1 场进行中；每日场次不限（v1.3 修订）

conduct:
  abuse_keywords: ["滚蛋", "蠢", "废物", "无耻"]   # 人身攻击检测词表，可扩展；避免单字误报（如"回滚"）
  max_interrupts_per_answer: 2

rag:
  enabled: true             # 证据检索增强（v1.4）：辩手上下文注入书籍/文献证据卡
  top_k: 3                  # 每阵营注入的证据卡数
  knowledge_dir: knowledge  # 证据卡目录（markdown）

tools:
  elenchus:                  # Elenchus 论证分析（v1.6）：谬误检测辅助逻辑评委（失败静默降级）
    enabled: true
    mode: inproc             # inproc（稳定）| mcp（stdio JSON-RPC，真 MCP 协议路径）
    check: fallacy           # fallacy / rhetoric / bias / scam / all
    per_camp: 2              # 每方分析的核心论点数
    timeout_seconds: 45.0    # 单条分析超时
    total_budget_seconds: 90.0  # 质检总预算（耗尽即停，防止拖住评委阶段）
    parallel: 2              # v2.4 多条核心论点并行分析度（1 = 顺序；mcp 模式强制顺序）
  agent:                     # v1.8 辩手 Agent 工具循环：LLM 经 function calling 主动调工具共同生成发言
    enabled: true
    max_tool_rounds: 2       # 每条发言最多工具往返轮数（控免费档 RPM 成本）
    tool_timeout_seconds: 15.0
    phases: [statement, rebuttal, attack_summary, closing]  # 启用环节（自由辩/质询为短打高频环节，默认不开）
                                                             # 动态证据检索（不走工具循环）仍对全部环节生效

web_search:
  enabled: true             # 联网搜索增强（v1.4.1）：开赛检索网络资料并入证据参考
  top_k: 3                  # 每阵营注入的网络结果数
  provider: env             # env（自动探测）/ zhipu（需搜索资源包）/ tavily（需 TAVILY_API_KEY）/ ddgs / none
                            # 搜索失败一律静默回落本地证据卡，绝不阻塞比赛

stream:
  enable_delta: true       # SSE speech_delta 流式直播（v2.1）

export:
  output_dir: debate        # CLI 模式输出目录
